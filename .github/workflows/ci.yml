name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install XML validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: npm ci

      - name: Check text quality
        run: |
          output="$(npm run check-text-quality -- --min-date=2021-01-01)"
          printf '%s\n' "$output"
          grep -Fq "Ingen tekstkvalitetsfejl fundet." <<< "$output"

      - name: Validate new text ids
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: npm run validate-new-text-ids -- "$BASE_SHA" "$HEAD_SHA"

      - name: Check generated and synced facsimiles
        env:
          KALLIOPE_FACSIMILE_BASE_URL: https://kalliope.org/facsimiles
        run: npm run check-facsimiles

      - name: Run tests (CI)
        run: npm run test-ci
        env:
          CI: true

  txt2xml:
    name: Run txt2xml tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run txt2xml tests
        run: ruby test/txt2xml_test.rb

  build-app:
    name: Build app and check pages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static data
        run: npm run build-static
        env:
          CI: true
          KALLIOPE_SKIP_ELASTICSEARCH: true
          KALLIOPE_SKIP_IMAGE_THUMBNAILS: true
          KALLIOPE_SHARP_CACHE_MEMORY: 64
          KALLIOPE_SHARP_CONCURRENCY: 1

      - name: Build container image
        run: docker build --target runtime -t kalliope-ci-app .

      - name: Start app in container and check homepage
        run: |
          set -e

          container_name="kalliope-ci-app-container"
          docker run --detach --name "$container_name" -p 3000:3000 \
            -v "$PWD/public/api:/app/public/api:ro" \
            -e KALLIOPE_SKIP_ELASTICSEARCH=true \
            -e KALLIOPE_SKIP_IMAGE_THUMBNAILS=true \
            -e KALLIOPE_SHARP_CACHE_MEMORY=64 \
            -e KALLIOPE_SHARP_CONCURRENCY=1 \
            kalliope-ci-app sh -c "npm run build && npm start"
          trap 'docker stop "$container_name" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/homepage.html; then
              echo "Homepage responds."
              break
            fi
            if ! docker inspect "$container_name" >/dev/null 2>&1; then
              echo "Container failed during startup."
              docker logs "$container_name"
              exit 1
            fi
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:3000/ >/dev/null; then
            echo "Homepage did not respond within timeout."
            docker logs "$container_name"
            exit 1
          fi

          for path in \
            /da/poets/dk/name \
            /da/keyword/romantikken \
            /da/text/guldhornene \
            /da/work/oehlenschlaeger/1803 \
            /da/bio/staffeldt; do
            echo "Checking $path"
            if ! curl -fsS "http://127.0.0.1:3000$path" >/dev/null; then
              echo "Smoke test failed for $path."
              docker logs "$container_name"
              exit 1
            fi
          done
